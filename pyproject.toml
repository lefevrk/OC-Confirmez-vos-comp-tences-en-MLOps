[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/v1"]

[project]
name = "credit-scoring-api"
version = "0.0.1"
description = "Credit scoring API — inference service (MLOps deployment repo)"
authors = [
  { name = "Kilian LEFEVRE" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
dependencies = [
    "lightgbm==4.7.0",
    "loguru",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
]
requires-python = ">=3.10.0"

[project.optional-dependencies]
# Runtime deps for the deployed API image (see Dockerfile).
api = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg2-binary",
    "mlflow",
    "prometheus-client",
]

[tool.ruff]
line-length = 100
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B"]
ignore = [
    "E501",
    "D100",
    "D104",
]

[tool.ruff.lint.isort]
known-first-party = ["api"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = ["test_*.py", "**/test_.py", "test.py"]

[tool.coverage.run]
source= ["src"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff>=0.14.14",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
]
