name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      test_depth:
        description: "full (release) or sanity (production)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts=(-o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key)
          vps_target="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          # deploy/compose.yml is the single source of truth for this
          # commit's deployment topology — always overwrite the VPS's copy,
          # never hand-edit it there. Only .env (secrets, IMAGE_TAG,
          # HOST_PORT) stays VPS-local.
          scp "${ssh_opts[@]}" deploy/compose.yml "${vps_target}:${{ vars.VPS_PATH }}/compose.yml"

          ssh "${ssh_opts[@]}" "$vps_target" \
            "cd ${{ vars.VPS_PATH }} && docker compose pull && \
             docker compose run --rm api alembic upgrade head && \
             docker compose up -d"

      - name: Wait for readiness
        run: ./scripts/wait_for_ready.sh "${{ vars.PUBLIC_URL }}"

      - name: Install uv
        if: inputs.test_depth == 'full'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run the full functional suite
        if: inputs.test_depth == 'full'
        env:
          API_BASE_URL: ${{ vars.PUBLIC_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          uv sync --extra api
          uv run pytest tests/functional/ -v

      - name: Sanity check
        if: inputs.test_depth == 'sanity'
        run: ./scripts/sanity_check.sh "${{ vars.PUBLIC_URL }}"
